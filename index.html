<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Jeu de Carrière</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <h1>Mon Jeu de Carrière</h1>
        <div id="stats-panel">
            <p><strong>Argent :</strong> <span id="stat-money">1000</span> €</p>
            <p><strong>Réputation :</strong> <span id="stat-reputation">10</span></p>
        </div>

        <div id="text-story">
            <p>Bienvenue dans ton aventure ! Tu commences tout juste au bas de l'échelle. Que décides-tu de faire pour ta première journée ?</p>
        </div>

        <div id="choices-container">
            <button onclick="faireChoix('entrainement')">S'entraîner dur (+ Réputation)</button>
            <button onclick="faireChoix('travailler')">Faire un petit boulot (+ Argent)</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
